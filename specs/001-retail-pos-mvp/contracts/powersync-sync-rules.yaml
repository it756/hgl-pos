# PowerSync sync-rules — Retail POS 001-retail-pos-mvp
#
# Bucket definitions and per-role subscription policy.
# JWT POS domain claims used as parameters: pos_role, store_id, till_id, device_id.
# See ../research.md §3 for the design rationale.
#
# Every bucket is either "parameter-scoped" (filters by a JWT claim -> one
# instance per parameter value) or "global" (fleet-wide, HQ only).

bucket_definitions:
  # -------- Cashier + Store manager buckets --------

  store_catalog:
    # Store-scoped SKU catalog + promotions
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') IN ('cashier', 'store_manager')
    data:
      - SELECT s.*
        FROM skus s
        JOIN store_sku_availability a
        ON a.sku_id = s.sku_id
        WHERE a.store_id = bucket.store_id
        AND a.is_stocked = true
        AND s.is_active = true
      - SELECT b.*
        FROM sku_barcodes b
        JOIN store_sku_availability a
        ON a.sku_id = b.sku_id
        WHERE a.store_id = bucket.store_id
      - SELECT * FROM sku_categories
      - SELECT * FROM promotions
        WHERE (store_id = bucket.store_id OR store_id IS NULL)
        AND is_active = true

  store_prices:
    # Store overrides + global fallbacks; effective now or in the future
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') IN ('cashier', 'store_manager')
    data:
      - SELECT * FROM price_versions
        WHERE store_id = bucket.store_id OR store_id IS NULL

  store_stock:
    # Read-only stock position + recent events for count-correction basis (EC-05)
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') IN ('cashier', 'store_manager')
    data:
      - SELECT * FROM current_stock_by_store_sku
        WHERE store_id = bucket.store_id
      - SELECT * FROM stock_events
        WHERE store_id = bucket.store_id

  store_users:
    # Cashier roster for offline login (US9) — includes pin_hash.
    # Also subscribed by the till device credential so the roster stays fresh
    # under the till's own long-lived sync even when no cashier is logged in
    # (research.md §3.4 rationale; guards FR-042 / EC-14).
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') IN ('cashier', 'store_manager', 'device')
    data:
      - SELECT user_id, role, store_id, full_name, pin_hash, pin_updated_at,
        is_active, created_at, updated_at
        FROM users
        WHERE store_id = bucket.store_id
        AND role = 'cashier'
        AND is_active = true

  # -------- Cashier-only bucket --------

  till_own_activity:
    # A till only receives back its OWN sales and shifts, never other tills'
    parameters: |
      SELECT request.jwt() ->> 'till_id' AS till_id
      WHERE (request.jwt() ->> 'pos_role') = 'cashier'
        AND (request.jwt() ->> 'till_id') IS NOT NULL
    data:
      - SELECT * FROM sale_events
        WHERE till_id = bucket.till_id
      - SELECT * FROM shift_events
        WHERE till_id = bucket.till_id
      - SELECT * FROM sales
        WHERE till_id = bucket.till_id
      - SELECT * FROM shifts
        WHERE till_id = bucket.till_id

  # -------- Store-manager-only buckets --------

  store_operations:
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') = 'store_manager'
    data:
      - SELECT * FROM transfers
        WHERE source_store_id = bucket.store_id
        OR destination_store_id = bucket.store_id
      - SELECT * FROM transfer_events
        WHERE source_store_id = bucket.store_id
        OR destination_store_id = bucket.store_id
      - SELECT * FROM adjustment_events
        WHERE store_id = bucket.store_id
      - SELECT * FROM sales
        WHERE store_id = bucket.store_id
      - SELECT * FROM shifts
        WHERE store_id = bucket.store_id

  sync_health_store:
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') = 'store_manager'
    data:
      - SELECT * FROM sync_health_snapshots
        WHERE store_id = bucket.store_id
      - SELECT * FROM sync_health_alerts
        WHERE store_id = bucket.store_id
      - SELECT * FROM tills
        WHERE store_id = bucket.store_id

  audit_log_store:
    parameters: |
      SELECT request.jwt() ->> 'store_id' AS store_id
      WHERE (request.jwt() ->> 'pos_role') = 'store_manager'
    data:
      - SELECT * FROM audit_log
        WHERE (new_value ->> 'store_id')::uuid = bucket.store_id
        OR (old_value ->> 'store_id')::uuid = bucket.store_id

  # -------- HQ-admin buckets --------

  fleet_all:
    parameters: |
      SELECT 1 AS ok
      WHERE (request.jwt() ->> 'pos_role') = 'hq_admin'
    data:
      - SELECT * FROM stores
      - SELECT * FROM tills
      - SELECT * FROM users
      - SELECT * FROM skus
      - SELECT * FROM sku_categories
      - SELECT * FROM sku_barcodes
      - SELECT * FROM store_sku_availability
      - SELECT * FROM price_versions
      - SELECT * FROM promotions
      - SELECT * FROM current_stock_by_store_sku
      - SELECT * FROM sales
      - SELECT * FROM shifts
      - SELECT * FROM transfers
      - SELECT * FROM stock_events
      - SELECT * FROM sale_events
      - SELECT * FROM shift_events
      - SELECT * FROM transfer_events
      - SELECT * FROM adjustment_events
      - SELECT * FROM price_change_events

  sync_health_all:
    parameters: |
      SELECT 1 AS ok
      WHERE (request.jwt() ->> 'pos_role') = 'hq_admin'
    data:
      - SELECT * FROM sync_health_snapshots
      - SELECT * FROM sync_health_alerts

  audit_log_all:
    parameters: |
      SELECT 1 AS ok
      WHERE (request.jwt() ->> 'pos_role') = 'hq_admin'
    data:
      - SELECT * FROM audit_log

  # -------- Till device credential (one-shot provisioning) --------

  device_provisioning:
    parameters: |
      SELECT request.jwt() ->> 'till_id' AS till_id
      WHERE (request.jwt() ->> 'pos_role') = 'device'
        AND (request.jwt() ->> 'till_id') IS NOT NULL
    data:
      - SELECT till_id, store_id, label, provisioned_at
        FROM tills
        WHERE till_id = bucket.till_id

# ---------------------------------------------------------------
# Isolation tests (see powersync/tests/):
#   - cashier at store A cannot see store B rows in any bucket
#   - cashier at till T cannot see till T+1 sale_events / shift_events
#   - store manager cannot see other stores' transfers or audit
#   - device credential JWT sees store_users[S] (roster refresh — FR-042/EC-14)
#     and device_provisioning[T] — but NOT catalog, prices, stock, sales,
#     shifts, transfers, adjustments, audit, or sync_health
# ---------------------------------------------------------------
# End of sync rules.
