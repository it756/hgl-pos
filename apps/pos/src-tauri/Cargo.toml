[package]
name = "hgl-pos"
version = "0.1.0"
description = "Harvest Group retail POS terminal shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hgl_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ASSUMPTION: crate name/version inferred from the JS wrapper @powersync/tauri-plugin@0.0.6
# (alpha) referenced in package.json — verify against the actual published crate on
# first build and correct if `cargo` can't resolve it.
tauri-plugin-powersync = "0.0.6"

# Direct dep on the underlying native SDK (T016 spike, connect() follow-up): needed to
# reach PowerSyncDatabase/BackendConnector types directly, since there is no JS-side
# connect() on this alpha plugin (see spike.rs's SpikeConnector doc comment).
powersync = "0.0.7"
async-trait = "0.1"

# Hand-signed dev-only JWTs for the spike's SpikeConnector (no real till auth session
# exists yet — see spike.rs). NOT for use once real Supabase Auth sessions are wired.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"

# Argon2id PIN hashing lives in the Rust shell (T041).
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# SQLCipher wiring for the on-till SQLite DB (T133).
# rusqlite is NOT enabled: the PowerSync Tauri SDK owns the SQLite connection
# and exposes no encryption-key/PRAGMA hook (verified against the installed
# @powersync/tauri-plugin 0.0.6 + tauri-plugin-powersync 0.0.6 — see
# src/db.rs module doc for details). windows-sys below only backs the DPAPI
# key-management half of T133 (key generation + at-rest protection), which
# is independent of the SQLCipher-on-connection gap.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
